services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8765}:8765"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
    volumes:
      - travel-data:/app/data
    restart: unless-stopped

volumes:
  travel-data:
